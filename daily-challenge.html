<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Πρόκληση Πληροφορικής – Δημοτικό Σχολείο</title>
  <meta name="description" content="Καθημερινό challenge πληκτρολόγησης και pixel art για το μάθημα της Πληροφορικής στο Δημοτικό.">
  <meta name="theme-color" content="#fbfaf7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbfaf7;
      --surface: #ffffff;
      --soft: #f3f5f8;
      --ink: #334155;
      --muted: #64748b;
      --border: #e5e9f0;
      --shadow-sm: 0 4px 12px rgba(51, 65, 85, 0.05);
      --shadow-md: 0 10px 28px rgba(51, 65, 85, 0.07);
      --shadow-pill: 0 4px 14px rgba(51, 65, 85, 0.06);

      /* Educational Tablet Palette */
      --sage: #84a955;
      --sage-dark: #6d8f42;
      --sage-soft: #eef5e6;
      --slate: #6b9ac4;
      --slate-dark: #5483ad;
      --slate-soft: #ebf3fa;
      --amber: #f2a649;
      --amber-dark: #d98d30;
      --amber-soft: #fef4e6;
      --purple: #9484b8;
      --purple-dark: #7a6aa1;
      --purple-soft: #f1eef8;
      --coral: #e56b6f;
      --coral-dark: #cc5458;
      --coral-soft: #fdeeee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: var(--surface);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px 24px;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .app-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--slate) 0%, var(--purple) 100%);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(107, 154, 196, 0.3);
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.6vw, 25px);
      font-weight: 900;
      color: var(--slate-dark);
      letter-spacing: -0.2px;
    }

    .status-pill {
      background: var(--amber-soft);
      color: #b56c14;
      border-radius: 999px;
      padding: 6px 15px;
      font-size: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill.manual {
      background: var(--slate-soft);
      color: var(--slate-dark);
    }

    /* Tablet Dock Style Grade Selector */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .grade-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--soft);
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
    }

    .grade-selector span {
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      padding: 0 6px;
    }

    .grade-btn {
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      width: 38px;
      height: 36px;
      border: none;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(51, 65, 85, 0.06);
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .grade-btn:hover {
      transform: translateY(-2px);
      background: var(--slate-soft);
      color: var(--slate-dark);
    }

    .grade-btn.active {
      background: var(--slate);
      color: #fff;
      box-shadow: 0 4px 10px rgba(107, 154, 196, 0.35);
      transform: scale(1.05);
    }

    /* Main Container */
    main {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 20px;
      flex: 1;
    }

    .card {
      background: var(--surface);
      border-radius: 28px;
      padding: 26px 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(229, 233, 240, 0.8);
    }

    /* Challenge Header Bar */
    .challenge-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--soft);
    }

    .challenge-title {
      font-size: clamp(22px, 2.8vw, 27px);
      font-weight: 900;
      margin: 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-badge-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--sage-soft);
      color: var(--sage-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .badge-rule {
      font-size: 13px;
      background: var(--sage-soft);
      color: var(--sage-dark);
      border-radius: 999px;
      padding: 5px 14px;
      font-weight: 800;
    }

    .badge-rule.strict {
      background: var(--purple-soft);
      color: var(--purple-dark);
    }

    .stats-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-box {
      background: var(--soft);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Friendly Rounded Buttons */
    button.action-btn {
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      padding: 12px 24px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 5px 14px rgba(51, 65, 85, 0.14);
      transition: transform 0.12s ease, box-shadow 0.15s ease, filter 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button.action-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    button.action-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(51, 65, 85, 0.12);
    }

    button.action-btn:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }

    .btn-check {
      background: var(--sage);
      box-shadow: 0 5px 14px rgba(132, 169, 85, 0.35);
    }
    .btn-clear {
      background: var(--coral);
      box-shadow: 0 5px 14px rgba(229, 107, 111, 0.3);
    }
    .btn-blue {
      background: var(--slate);
      box-shadow: 0 5px 14px rgba(107, 154, 196, 0.35);
    }

    /* Typing Challenge Styles */
    .typing-block {
      background: var(--soft);
      border-radius: 22px;
      padding: 20px 22px;
      margin-bottom: 18px;
      border: 2px solid transparent;
      transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;
    }

    .typing-block.completed {
      background: var(--sage-soft);
      border-color: rgba(132, 169, 85, 0.45);
    }

    .lang-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: var(--purple);
      color: #fff;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .target-sentence {
      font-size: clamp(22px, 3vw, 29px);
      font-weight: 800;
      line-height: 1.55;
      letter-spacing: 0.4px;
      background: var(--surface);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      user-select: none;
      word-wrap: break-word;
    }

    .char-ok {
      color: #4d7c1f;
      background: #e2f3d1;
      border-radius: 5px;
      padding: 0 1px;
    }

    .char-err {
      color: #c23b40;
      background: #fad4d5;
      border-bottom: 3px solid var(--coral);
      border-radius: 5px;
      padding: 0 1px;
    }

    .char-pending {
      color: var(--ink);
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: stretch;
    }

    .typing-input {
      flex: 1;
      min-width: 240px;
      font: inherit;
      font-size: clamp(20px, 2.5vw, 25px);
      font-weight: 700;
      padding: 13px 18px;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: inset 0 2px 5px rgba(51, 65, 85, 0.04);
      transition: border-color 0.2s, background 0.2s;
    }

    .typing-input:focus {
      border-color: var(--slate);
    }

    .typing-input.has-error {
      border-color: var(--coral);
      background: var(--coral-soft);
    }

    .typing-input.is-valid {
      border-color: var(--sage);
      background: #f4faee;
    }

    .feedback-msg {
      margin-top: 10px;
      font-size: 16px;
      font-weight: 800;
      min-height: 24px;
      padding-left: 4px;
    }

    .feedback-msg.err { color: var(--coral-dark); }
    .feedback-msg.ok  { color: var(--sage-dark); }

    /* Pixel Art Challenge Styles (Grade A) */
    .pixel-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: flex-start;
      justify-content: center;
    }

    .boards-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      align-items: flex-start;
      justify-content: center;
    }

    .board-box {
      background: var(--soft);
      border-radius: 24px;
      padding: 18px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .board-box.ref-card {
      background: var(--amber-soft);
    }

    .board-label {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      padding: 5px 16px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(51, 65, 85, 0.05);
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      touch-action: none;
    }

    #userCanvas {
      cursor: crosshair;
    }

    #refCanvas {
      cursor: default;
    }

    .pixel-tools {
      background: var(--purple-soft);
      border-radius: 24px;
      padding: 20px;
      min-width: 230px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .pixel-tools h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      color: var(--purple-dark);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      gap: 10px;
      justify-content: center;
    }

    .swatch {
      width: 56px;
      height: 56px;
      border: 4px solid #ffffff;
      border-radius: 18px;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 4px 10px rgba(51, 65, 85, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .swatch:hover {
      transform: scale(1.06);
    }

    .swatch.selected {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
      transform: scale(1.1);
    }

    .eraser-btn {
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      padding: 11px;
      border: none;
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      width: 100%;
      box-shadow: 0 3px 8px rgba(51, 65, 85, 0.08);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .eraser-btn.selected {
      background: var(--amber);
      color: #fff;
      box-shadow: 0 4px 12px rgba(242, 166, 73, 0.4);
    }

    .pixel-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .pixel-actions button {
      width: 100%;
      justify-content: center;
    }

    /* Success Banner (Inline & Persistent) */
    .success-banner {
      display: none;
      margin-top: 22px;
      background: linear-gradient(135deg, var(--amber-soft) 0%, var(--sage-soft) 100%);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 22px rgba(132, 169, 85, 0.18);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-banner.show {
      display: block;
    }

    .stars-row {
      font-size: 46px;
      line-height: 1.1;
      margin-bottom: 8px;
      letter-spacing: 8px;
    }

    .success-banner h2 {
      margin: 4px 0 8px;
      font-size: 27px;
      font-weight: 900;
      color: var(--sage-dark);
    }

    .success-banner p {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Confetti */
    #confettiLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 12px;
      height: 18px;
      border-radius: 6px;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 640px) {
      header {
        padding: 12px 14px;
      }
      main {
        padding: 14px 12px;
      }
      .card {
        padding: 18px 16px;
        border-radius: 22px;
      }
      .grade-btn {
        width: 34px;
        height: 32px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="app-icon">💻</div>
    <h1>Πρόκληση Πληροφορικής</h1>
    <div id="scheduleBadge" class="status-pill">⏳ Έλεγχος ώρας...</div>
  </div>

  <div class="controls-bar">
    <div class="grade-selector" role="group" aria-label="Επιλογή τάξης">
      <span>Τάξη</span>
      <button type="button" class="grade-btn" data-grade="Α">Α΄</button>
      <button type="button" class="grade-btn" data-grade="Β">Β΄</button>
      <button type="button" class="grade-btn" data-grade="Γ">Γ΄</button>
      <button type="button" class="grade-btn" data-grade="Δ">Δ΄</button>
      <button type="button" class="grade-btn" data-grade="Ε">Ε΄</button>
      <button type="button" class="grade-btn" data-grade="ΣΤ">ΣΤ΄</button>
    </div>
  </div>
</header>

<main>
  <section class="card" id="challengeCard">
    <div class="challenge-top">
      <div>
        <h2 class="challenge-title" id="challengeHeading">
          <span class="title-badge-icon" id="headingIcon">⌨️</span>
          <span id="headingText">Φόρτωση πρόκλησης...</span>
        </h2>
        <div style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <span id="dateContextText" style="font-size:15px; font-weight:800; color:var(--muted);"></span>
          <span id="ruleBadge" class="badge-rule"></span>
        </div>
      </div>

      <div class="stats-row" id="statsContainer">
        <div class="stat-box" title="Χρόνος">⏱️ <span id="timerDisplay">00:00</span></div>
        <div class="stat-box" id="wpmBox" title="Λέξεις ανά λεπτό">⚡ <span id="wpmDisplay">0</span> λ/λ</div>
      </div>
    </div>

    <!-- Περιοχή Πληκτρολόγησης (Β΄ - ΣΤ΄) -->
    <div id="typingArea" hidden></div>

    <!-- Περιοχή Pixel Art (Α΄ Τάξη) -->
    <div id="pixelArea" hidden>
      <div class="pixel-layout">
        <div class="boards-wrap">
          <div class="board-box">
            <div class="board-label">✏️ Ο καμβάς σου</div>
            <canvas id="userCanvas"></canvas>
          </div>
          <div class="board-box ref-card">
            <div class="board-label" id="refTitle">🎨 Αντίγραψε: Εικόνα</div>
            <canvas id="refCanvas"></canvas>
          </div>
        </div>

        <div class="pixel-tools">
          <h3>🎨 Χρώματα</h3>
          <div class="palette-grid" id="pixelPalette"></div>
          <button type="button" class="eraser-btn" id="pixelEraser">🧽 Γόμα</button>
          <div id="pixelFeedback" class="feedback-msg" style="text-align:center;"></div>
          <div class="pixel-actions">
            <button type="button" class="action-btn btn-check" id="pixelCheckBtn">✅ Έλεγχος</button>
            <button type="button" class="action-btn btn-clear" id="pixelClearBtn">🗑️ Καθαρισμός</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Μήνυμα Επιτυχίας (παραμένει ανοιχτό) -->
    <div id="successBanner" class="success-banner" role="status" aria-live="polite">
      <div class="stars-row">⭐⭐⭐</div>
      <h2 id="successTitle">Μπράβο! Τα κατάφερες!</h2>
      <p id="successDetails"></p>
    </div>
  </section>
</main>

<footer>
  Εργαστήριο Πληροφορικής Δημοτικού • Κάθε εβδομάδα μια νέα πρόκληση!
</footer>

<script>
/* ==========================================================================
   1. ΔΕΔΟΜΕΝΑ ΠΡΟΓΡΑΜΜΑΤΟΣ & ΩΡΑΡΙΟΥ
   ========================================================================== */
const PERIODS = [
  { num: 1, label: "1η ώρα", startMin: 8 * 60 + 10, endMin: 9 * 60 + 0 },   // 08:10 - 09:00 (έναρξη 08:15)
  { num: 2, label: "2η ώρα", startMin: 8 * 60 + 55, endMin: 9 * 60 + 40 },  // 08:55 - 09:40 (έναρξη 09:00)
  { num: 3, label: "3η ώρα", startMin: 9 * 60 + 55, endMin: 10 * 60 + 45 }, // 09:55 - 10:45 (έναρξη 10:00)
  { num: 4, label: "4η ώρα", startMin: 10 * 60 + 40, endMin: 11 * 60 + 30 },// 10:40 - 11:30 (έναρξη 10:45)
  { num: 5, label: "5η ώρα", startMin: 11 * 60 + 40, endMin: 12 * 60 + 25 },// 11:40 - 12:25 (έναρξη 11:45)
  { num: 6, label: "6η ώρα", startMin: 12 * 60 + 30, endMin: 13 * 60 + 15 } // 12:30 - 13:15 (έναρξη 12:35)
];

// Ημέρες εβδομάδας JS: 1=Δευτέρα, 2=Τρίτη, 3=Τετάρτη, 4=Πέμπτη, 5=Παρασκευή
const TIMETABLE = {
  1: { 1: "Β", 2: "Ε", 4: "ΣΤ", 6: "Γ" },
  2: { 4: "ΣΤ", 6: "Α" },
  3: { 4: "Δ", 6: "Γ" },
  4: { 5: "Α", 6: "Ε" },
  5: { 5: "Β" }
};

const MONTH_KEYS = [
  "january", "february", "march", "april", "may", "june",
  "june", "june", "september", "october", "november", "december"
];

const MONTH_NAMES_EL = {
  september: "Σεπτέμβριος",
  october: "Οκτώβριος",
  november: "Νοέμβριος",
  december: "Δεκέμβριος",
  january: "Ιανουάριος",
  february: "Φεβρουάριος",
  march: "Μάρτιος",
  april: "Απρίλιος",
  may: "Μάιος",
  june: "Ιούνιος"
};

/* ==========================================================================
   2. ΠΡΟΤΑΣΕΙΣ ΠΛΗΚΤΡΟΛΟΓΗΣΗΣ ΑΝΑ ΤΑΞΗ ΚΑΙ ΜΗΝΑ
   ========================================================================== */
const TYPING_DATA = {
  "Β": {
    september: [
      "Η γάτα παίζει.",
      "Ο ήλιος λάμπει.",
      "Το σκυλί τρέχει."
    ],

   ========================================================================== */
const state = {
  grade: "Β",
  isAutoGrade: false,
  autoPeriodLabel: "",
  monthKey: "september",
  monthNameEl: "Σεπτέμβριος",
  weekOfMonth: 1,       // 1..5
  sentenceIndex: 0,     // 0, 1, 2
  // Timer & WPM
  timerStarted: false,
  startTimeMs: null,
  elapsedSec: 0,
  timerInterval: null,
  challengeCompleted: false,
  // Typing fields
  typingFields: [],     // [{ id, lang, target, inputEl, targetEl, msgEl, blockEl, solved }]
  // Pixel Art
  pixelRows: 0,
  pixelCols: 0,
  pixelTarget: [],
  pixelUser: [],
  pixelColor: "#e53935",
  pixelErasing: false,
  pixelPainting: false,
  pixelCellSize: 44
};

const $ = id => document.getElementById(id);

/**
 * Υπολογίζει τον τρέχοντα μήνα, εβδομάδα και αν υπάρχει ενεργό μάθημα.
 */
function detectContext(now = new Date()) {
  const m = now.getMonth(); // 0=Ιαν..11=Δεκ
  const monthKey = MONTH_KEYS[m];
  const monthNameEl = MONTH_NAMES_EL[monthKey];

  const dayOfMonth = now.getDate();
  const weekOfMonth = Math.floor((dayOfMonth - 1) / 7) + 1; // 1, 2, 3, 4, 5
  const sentenceIndex = (weekOfMonth - 1) % 3;              // 0, 1, 2

  const dow = now.getDay(); // 1=Δευτέρα .. 5=Παρασκευή
  const mins = now.getHours() * 60 + now.getMinutes();

  let detectedGrade = null;
  let periodLabel = "";

  if (TIMETABLE[dow]) {
    for (const p of PERIODS) {
      if (mins >= p.startMin && mins < p.endMin) {
        const g = TIMETABLE[dow][p.num];
        if (g) {
          detectedGrade = g;
          periodLabel = p.label;
        }
        break;
      }
    }
  }

  return {
    monthKey,
    monthNameEl,
    weekOfMonth,
    sentenceIndex,
    detectedGrade,
    periodLabel
  };
}

/**
 * Κανονικοποίηση κειμένου για τη Β΄ τάξη (χωρίς τόνους και κεφαλαία).
 */
function normalizeGradeB(str) {
  return str
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

/**
 * Κανονικοποίηση Unicode σημείων στίξης (π.χ. ελληνικό ερωτηματικό \u037E -> ;)
 */
function normalizeUnicodePunctuation(str) {
  return str
    .replace(/\u037e/g, ";")
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201c\u201d]/g, '"')
    .normalize("NFC");
}

/* ==========================================================================
   5. ΧΡΟΝΟΜΕΤΡΟ & WPM
   ========================================================================== */
function resetTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
  state.timerStarted = false;
  state.startTimeMs = null;
  state.elapsedSec = 0;
  $("timerDisplay").textContent = "00:00";
  $("wpmDisplay").textContent = "0";
}

function startTimerIfNeeded() {
  if (state.timerStarted || state.challengeCompleted) return;
  state.timerStarted = true;
  state.startTimeMs = Date.now();
  state.timerInterval = setInterval(updateMetrics, 250);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
  updateMetrics();
}

function formatTime(totalSeconds) {
  const s = Math.floor(totalSeconds);
  const mins = Math.floor(s / 60);
  const secs = s % 60;
  return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
}

function getTotalTypedChars() {
  if (state.grade === "Α") return 0;
  return state.typingFields.reduce((acc, f) => acc + f.inputEl.value.length, 0);
}

function updateMetrics() {
  if (!state.timerStarted || !state.startTimeMs) return;
  const elapsedMs = Date.now() - state.startTimeMs;
  state.elapsedSec = Math.max(1, elapsedMs / 1000);
  $("timerDisplay").textContent = formatTime(state.elapsedSec);

  if (state.grade !== "Α") {
    const chars = getTotalTypedChars();
    const minutes = state.elapsedSec / 60;
    const wpm = Math.round((chars / 5) / minutes);
    $("wpmDisplay").textContent = String(wpm);
  }
}

/* ==========================================================================
   6. ΕΠΙΤΥΧΙΑ & ΚΟΜΦΕΤΙ
   ========================================================================== */
function triggerSuccess(detailsText) {
  if (state.challengeCompleted) return;
  state.challengeCompleted = true;
  stopTimer();

  $("successTitle").textContent = "Μπράβο! Ολοκλήρωσες την πρόκληση!";
  $("successDetails").textContent = detailsText;
  $("successBanner").classList.add("show");
  launchConfetti();
}

function launchConfetti() {
  const existing = $("confettiLayer");
  if (existing) existing.remove();

  const layer = document.createElement("div");
  layer.id = "confettiLayer";
  const colors = ["#84a955", "#6b9ac4", "#f2a649", "#9484b8", "#e56b6f", "#ffd166", "#4ecdc4"];

  for (let i = 0; i < 85; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    const left = Math.random() * 100;
    const delay = Math.random() * 1.2;
    const duration = 2.2 + Math.random() * 2;
    const color = colors[Math.floor(Math.random() * colors.length)];
    piece.style.left = left + "%";
    piece.style.background = color;
    piece.style.animationDelay = delay + "s";
    piece.style.animationDuration = duration + "s";
    layer.appendChild(piece);
  }

  document.body.appendChild(layer);
  setTimeout(() => {
    if (layer.parentNode) layer.remove();
  }, 4800);
}

   7. ΛΕΙΤΟΥΡΓΙΑ ΠΛΗΚΤΡΟΛΟΓΗΣΗΣ (Β΄ - ΣΤ΄)
   ========================================================================== */
function renderTypingChallenge() {
  const grade = state.grade;
  const monthKey = state.monthKey;
  const idx = state.sentenceIndex;
  const isGradeB = grade === "Β";

  $("typingArea").hidden = false;
  $("pixelArea").hidden = true;
  $("wpmBox").hidden = false;

  $("headingIcon").textContent = "⌨️";
  $("headingIcon").style.background = "var(--slate-soft)";
  $("headingIcon").style.color = "var(--slate-dark)";
  $("headingText").textContent = `Πληκτρολόγηση • ${grade}΄ Τάξη`;
  $("ruleBadge").textContent = isGradeB
    ? "Χωρίς έλεγχο τόνων & κεφαλαίων"
    : "Ακριβής έλεγχος (τόνοι, κεφαλαία, στίξη)";
  $("ruleBadge").className = isGradeB ? "badge-rule" : "badge-rule strict";

  const container = $("typingArea");
  container.innerHTML = "";
  state.typingFields = [];

  let items = [];
  if (grade === "Β" || grade === "Γ" || grade === "Δ") {
    const sentence = TYPING_DATA[grade][monthKey][idx];
    items.push({ lang: "Ελληνικά", text: sentence });
  } else {
    // Ε΄ και ΣΤ΄: Δύο προτάσεις (Ελληνικά & Αγγλικά)
    // Μονές εβδομάδες (1η, 3η, 5η): πρώτα Ελληνικά. Ζυγές (2η, 4η): πρώτα Αγγλικά.
    const elSentence = TYPING_DATA[grade][monthKey].el[idx];
    const enSentence = TYPING_DATA[grade][monthKey].en[idx];
    const isOddWeek = (state.weekOfMonth % 2) === 1;

    if (isOddWeek) {
      items.push({ lang: "🇬🇷 Ελληνικά", text: elSentence });
      items.push({ lang: "🇬🇧 English", text: enSentence });
    } else {
      items.push({ lang: "🇬🇧 English", text: enSentence });
      items.push({ lang: "🇬🇷 Ελληνικά", text: elSentence });
    }
  }

  items.forEach((item, index) => {
    const block = document.createElement("div");
    block.className = "typing-block";

    const langTag = document.createElement("div");
    langTag.className = "lang-tag";
    langTag.textContent = item.lang;

    const targetBox = document.createElement("div");
    targetBox.className = "target-sentence";
    targetBox.textContent = item.text;

    const inputRow = document.createElement("div");
    inputRow.className = "input-row";

    const inputEl = document.createElement("input");
    inputEl.type = "text";
    inputEl.className = "typing-input";
    inputEl.placeholder = "Πληκτρολόγησε την πρόταση εδώ...";
    inputEl.autocomplete = "off";
    inputEl.autocorrect = "off";
    inputEl.autocapitalize = "off";
    inputEl.spellcheck = false;
    inputEl.setAttribute("onpaste", "return false");
    inputEl.setAttribute("ondrop", "return false");

    const checkBtn = document.createElement("button");
    checkBtn.type = "button";
    checkBtn.className = "action-btn btn-check";
    checkBtn.innerHTML = "✅ Έλεγχος";

    const msgEl = document.createElement("div");
    msgEl.className = "feedback-msg";

    inputRow.appendChild(inputEl);
    inputRow.appendChild(checkBtn);

    block.appendChild(langTag);
    block.appendChild(targetBox);
    block.appendChild(inputRow);
    block.appendChild(msgEl);
    container.appendChild(block);

    const fieldObj = {
      id: index,
      target: item.text,
      inputEl,
      targetEl: targetBox,
      msgEl,
      blockEl: block,
      solved: false
    };
    state.typingFields.push(fieldObj);

    // Live ανατροφοδότηση καθώς πληκτρολογεί ο μαθητής
    inputEl.addEventListener("input", () => {
      startTimerIfNeeded();
      evaluateTypingField(fieldObj, false);
      updateMetrics();
    });

    // Έλεγχος με Enter ή κλικ στο κουμπί
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        evaluateTypingField(fieldObj, true);
      }
    });

    checkBtn.addEventListener("click", () => {
      startTimerIfNeeded();
      evaluateTypingField(fieldObj, true);
    });
  });

  if (state.typingFields.length > 0) {
    state.typingFields[0].inputEl.focus();
  }
}

function escapeHtml(ch) {
  if (ch === "&") return "&amp;";
  if (ch === "<") return "&lt;";
  if (ch === ">") return "&gt;";
  return ch;
}

/**
 * Ελέγχει ένα πεδίο πληκτρολόγησης, χρωματίζει σωστά/λάθη και ενημερώνει την κατάσταση.
 */
function evaluateTypingField(fieldObj, explicitCheck) {
  const isGradeB = state.grade === "Β";
  const rawTarget = normalizeUnicodePunctuation(fieldObj.target);
  const rawTyped = normalizeUnicodePunctuation(fieldObj.inputEl.value);

  const normTarget = isGradeB ? normalizeGradeB(rawTarget) : rawTarget;
  const normTyped = isGradeB ? normalizeGradeB(rawTyped) : rawTyped;

  // Δημιουργία χρωματισμένου HTML για την πρόταση-στόχο
  let html = "";
  let hasAnyError = false;

  for (let i = 0; i < rawTarget.length; i++) {
    const displayChar = escapeHtml(rawTarget[i]);
    if (i < normTyped.length) {
      if (normTyped[i] === normTarget[i]) {
        html += `<span class="char-ok">${displayChar}</span>`;
      } else {
        html += `<span class="char-err">${displayChar}</span>`;
        hasAnyError = true;
      }
    } else {
      html += `<span class="char-pending">${displayChar}</span>`;
    }
  }

  // Αν ο μαθητής έγραψε επιπλέον χαρακτήρες πέρα από το μήκος της πρότασης
  if (normTyped.length > normTarget.length) {
    hasAnyError = true;
    const extra = escapeHtml(rawTyped.slice(rawTarget.length));
    html += `<span class="char-err" title="Επιπλέον χαρακτήρες">${extra}</span>`;
  }

  fieldObj.targetEl.innerHTML = html;

  // Έλεγχος πλήρους αντιστοιχίας
  const isExactMatch = (normTyped === normTarget);

  if (isExactMatch) {
    fieldObj.solved = true;
    fieldObj.inputEl.classList.remove("has-error");
    fieldObj.inputEl.classList.add("is-valid");
    fieldObj.blockEl.classList.add("completed");
    fieldObj.msgEl.className = "feedback-msg ok";
    fieldObj.msgEl.textContent = "✔ Τέλεια! Η πρόταση είναι ολόσωστη!";

    // Αν υπάρχουν κι άλλες προτάσεις (Ε΄/ΣΤ΄), μετακίνηση στην επόμενη άλυτη
    const nextUnsolved = state.typingFields.find(f => !f.solved);
    if (nextUnsolved) {
      if (explicitCheck) nextUnsolved.inputEl.focus();
    } else {
      const finalTime = $("timerDisplay").textContent;
      const finalWpm = $("wpmDisplay").textContent;
      triggerSuccess(`Χρόνος: ${finalTime} • Ταχύτητα: ${finalWpm} λέξεις/λεπτό!`);
    }
  } else {
    fieldObj.solved = false;
    fieldObj.blockEl.classList.remove("completed");
    fieldObj.inputEl.classList.remove("is-valid");

    if (hasAnyError) {
      fieldObj.inputEl.classList.add("has-error");
      fieldObj.msgEl.className = "feedback-msg err";
      fieldObj.msgEl.textContent = "⚠️ Πρόσεξε τα κόκκινα γράμματα! Διόρθωσέ τα.";
    } else {
      fieldObj.inputEl.classList.remove("has-error");
      fieldObj.msgEl.className = "feedback-msg";
      if (explicitCheck) {
        fieldObj.msgEl.className = "feedback-msg err";
        fieldObj.msgEl.textContent = "Συνέχισε! Δεν έχεις ολοκληρώσει ακόμα όλη την πρόταση.";
      } else {
        fieldObj.msgEl.textContent = "";
      }
    }
  }
}

/* ==========================================================================
   8. ΛΕΙΤΟΥΡΓΙΑ PIXEL ART (Α΄ ΤΑΞΗ)
   ========================================================================== */
function renderPixelArtChallenge() {
  $("typingArea").hidden = true;
  $("pixelArea").hidden = false;
  $("wpmBox").hidden = true;

  const item = PIXEL_ART_DATA[state.monthKey][state.sentenceIndex];
  $("headingIcon").textContent = "🎨";
  $("headingIcon").style.background = "var(--amber-soft)";
  $("headingIcon").style.color = "var(--amber-dark)";
  $("headingText").textContent = `Αντιγραφή Pixel Art • Α΄ Τάξη`;
  $("ruleBadge").textContent = `Πλέγμα ${item.grid[0].length}×${item.grid.length}`;
  $("ruleBadge").className = "badge-rule";
  $("refTitle").textContent = `🖼️ Αντίγραψε: ${item.name}`;

  state.pixelRows = item.grid.length;
  state.pixelCols = item.grid[0].length;
  state.pixelTarget = [];
  const usedColorCodes = new Set();

  for (let r = 0; r < state.pixelRows; r++) {
    for (let c = 0; c < state.pixelCols; c++) {
      const code = item.grid[r][c];
      if (code === "." || !PIXEL_PALETTE_MAP[code]) {
        state.pixelTarget.push(null);
      } else {
        state.pixelTarget.push(PIXEL_PALETTE_MAP[code]);
        usedColorCodes.add(code);
      }
    }
  }

  state.pixelUser = new Array(state.pixelRows * state.pixelCols).fill(null);

  // Δημιουργία παλέτας (τα χρώματα της εικόνας + 1-2 έξτρα βασικά χρώματα)
  const extraCodes = ["R", "B", "Y", "G", "O", "P"];
  for (const ec of extraCodes) {
    if (usedColorCodes.size >= Math.min(6, usedColorCodes.size + 2)) break;
    if (!usedColorCodes.has(ec)) {
      usedColorCodes.add(ec);
      if (usedColorCodes.size >= 4) break;
    }
  }

  const paletteColors = Array.from(usedColorCodes).map(c => PIXEL_PALETTE_MAP[c]);
  state.pixelColor = paletteColors[0] || "#e53935";
  state.pixelErasing = false;

  const palEl = $("pixelPalette");
  palEl.innerHTML = "";
  paletteColors.forEach(hex => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "swatch";
    btn.style.background = hex;
    btn.dataset.color = hex;
    btn.setAttribute("aria-label", "Επιλογή χρώματος");
    btn.addEventListener("click", () => {
      state.pixelColor = hex;
      state.pixelErasing = false;
      refreshPixelTools();
    });
    palEl.appendChild(btn);
  });

  refreshPixelTools();
  $("pixelFeedback").textContent = "";
  drawPixelBoards();
}

function refreshPixelTools() {
  document.querySelectorAll("#pixelPalette .swatch").forEach(btn => {
    btn.classList.toggle("selected", !state.pixelErasing && btn.dataset.color === state.pixelColor);
  });
  $("pixelEraser").classList.toggle("selected", state.pixelErasing);
}

function drawPixelBoards() {
  if (state.grade !== "Α" || !state.pixelRows) return;

  // Υπολογισμός μεγέθους τετραγώνου ανάλογα με την οθόνη
  const maxBoardPx = Math.min(260, Math.floor((window.innerWidth - 120) / 2));
  const cell = Math.max(28, Math.min(48, Math.floor(maxBoardPx / Math.max(state.pixelRows, state.pixelCols))));
  state.pixelCellSize = cell;

  drawSingleGrid($("userCanvas"), state.pixelUser, cell);
  drawSingleGrid($("refCanvas"), state.pixelTarget, cell);
}

function drawSingleGrid(canvas, cellsArray, cell) {
  const ctx = canvas.getContext("2d");
  const rows = state.pixelRows;
  const cols = state.pixelCols;
  const fs = Math.max(12, Math.min(16, Math.floor(cell * 0.38)));
  const marginL = Math.round(fs * 2.1);
  const marginT = Math.round(fs * 1.8);

  canvas.width = marginL + cols * cell;
  canvas.height = marginT + rows * cell;

  // Φόντο
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Γέμισμα κελιών
  for (let i = 0; i < cellsArray.length; i++) {
    if (cellsArray[i]) {
      const x = i % cols;
      const y = Math.floor(i / cols);
      ctx.fillStyle = cellsArray[i];
      ctx.fillRect(marginL + x * cell, marginT + y * cell, cell, cell);
    }
  }

  // Απαλές γραμμές πλέγματος
  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x <= cols; x++) {
    ctx.moveTo(marginL + x * cell + 0.5, marginT);
    ctx.lineTo(marginL + x * cell + 0.5, marginT + rows * cell);
  }
  for (let y = 0; y <= rows; y++) {
    ctx.moveTo(marginL, marginT + y * cell + 0.5);
    ctx.lineTo(marginL + cols * cell, marginT + y * cell + 0.5);
  }
  ctx.stroke();

  // Αρίθμηση στηλών (1..N) & γραμμών (1..N)
  ctx.fillStyle = "#64748b";
  ctx.font = `800 ${fs}px "Nunito", "Trebuchet MS", sans-serif`;
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  for (let x = 0; x < cols; x++) {
    ctx.fillText(String(x + 1), marginL + x * cell + cell / 2, marginT / 2);
  }
  ctx.textAlign = "right";
  for (let y = 0; y < rows; y++) {
    ctx.fillText(String(y + 1), marginL - 6, marginT + y * cell + cell / 2 + 1);
  }
}

function handlePixelPointer(e) {
  const canvas = $("userCanvas");
  const rect = canvas.getBoundingClientRect();
  const cell = state.pixelCellSize;
  const fs = Math.max(12, Math.min(16, Math.floor(cell * 0.38)));
  const marginL = Math.round(fs * 2.1);
  const marginT = Math.round(fs * 1.8);

  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  const x = Math.floor(((e.clientX - rect.left) * scaleX - marginL) / cell);
  const y = Math.floor(((e.clientY - rect.top) * scaleY - marginT) / cell);

  if (x < 0 || y < 0 || x >= state.pixelCols || y >= state.pixelRows) return;

  startTimerIfNeeded();

  const idx = y * state.pixelCols + x;
  const newVal = state.pixelErasing ? null : state.pixelColor;
  if (state.pixelUser[idx] !== newVal) {
    state.pixelUser[idx] = newVal;
    drawPixelBoards();
  }
}

// Σύνδεση συμβάντων ζωγραφικής στον καμβά
const userCv = $("userCanvas");
userCv.addEventListener("pointerdown", e => {
  state.pixelPainting = true;
  userCv.setPointerCapture(e.pointerId);
  handlePixelPointer(e);
});
userCv.addEventListener("pointermove", e => {
  if (state.pixelPainting) handlePixelPointer(e);
});
["pointerup", "pointercancel"].forEach(ev => {
  userCv.addEventListener(ev, () => { state.pixelPainting = false; });
});

$("pixelEraser").addEventListener("click", () => {
  state.pixelErasing = true;
  refreshPixelTools();
});

$("pixelClearBtn").addEventListener("click", () => {
  state.pixelUser.fill(null);
  $("pixelFeedback").textContent = "";
  drawPixelBoards();
});

$("pixelCheckBtn").addEventListener("click", () => {
  let correctCount = 0;
  let wrongCount = 0;

  for (let i = 0; i < state.pixelTarget.length; i++) {
    const u = state.pixelUser[i];
    const t = state.pixelTarget[i];
    if (u === t) {
      correctCount++;
    } else if (u !== null) {
      // Σβήνει τα λάθος χρωματισμένα τετραγωνάκια ώστε να βοηθήσει τα παιδιά της Α΄ τάξης
      state.pixelUser[i] = null;
      wrongCount++;
    }
  }

  drawPixelBoards();

  if (correctCount === state.pixelTarget.length) {
    $("pixelFeedback").className = "feedback-msg ok";
    $("pixelFeedback").textContent = "✔ Τέλεια ζωγραφιά!";
    const finalTime = $("timerDisplay").textContent;
    triggerSuccess(`Αντέγραψες σωστά την εικόνα σε ${finalTime}!`);
  } else {
    $("pixelFeedback").className = "feedback-msg err";
    if (wrongCount > 0) {
      $("pixelFeedback").textContent = `Έσβησα ${wrongCount} λάθος τετραγωνάκια. Συνέχισε!`;
    } else {
      const remaining = state.pixelTarget.length - correctCount;
      $("pixelFeedback").textContent = `Πολύ καλά! Μένουν ακόμα ${remaining} τετραγωνάκια.`;
    }
  }
});

window.addEventListener("resize", () => {
  if (state.grade === "Α") drawPixelBoards();
});

/* ==========================================================================
   9. ΕΝΑΛΛΑΓΗ ΤΑΞΗΣ & ΑΡΧΙΚΟΠΟΙΗΣΗ
   ========================================================================== */
function loadChallengeForGrade(grade, isAuto = false, periodLabel = "") {
  state.grade = grade;
  state.isAutoGrade = isAuto;
  state.autoPeriodLabel = periodLabel;
  state.challengeCompleted = false;

  resetTimer();
  $("successBanner").classList.remove("show");

  // Ενημέρωση κουμπιών επιλογής τάξης
  document.querySelectorAll(".grade-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.grade === grade);
  });

  // Ενημέρωση badge ώρας
  const badge = $("scheduleBadge");
  if (isAuto && periodLabel) {
    badge.textContent = `🔔 Τώρα: ${periodLabel} • ${grade}΄ Τάξη`;
    badge.className = "status-pill";
  } else {
    badge.textContent = `📚 Ελεύθερη επιλογή • ${grade}΄ Τάξη`;
    badge.className = "status-pill manual";
  }

  $("dateContextText").textContent = `📅 ${state.monthNameEl} • ${state.weekOfMonth}η εβδομάδα`;

  if (grade === "Α") {
    renderPixelArtChallenge();
  } else {
    renderTypingChallenge();
  }
}

document.querySelectorAll(".grade-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const selected = btn.dataset.grade;
    loadChallengeForGrade(selected, false, "");
  });
});

function initApp() {
  const ctx = detectContext(new Date());
  state.monthKey = ctx.monthKey;
  state.monthNameEl = ctx.monthNameEl;
  state.weekOfMonth = ctx.weekOfMonth;
  state.sentenceIndex = ctx.sentenceIndex;

  if (ctx.detectedGrade) {
    loadChallengeForGrade(ctx.detectedGrade, true, ctx.periodLabel);
  } else {
    loadChallengeForGrade("Β", false, "");
  }
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
